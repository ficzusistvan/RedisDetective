name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Needed only when the source repo is public (npm provenance). Harmless on a private repo.
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Check git tag matches the CLI version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./packages/cli/package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag v${tag} does not match packages/cli version ${version}."
            exit 1
          fi
      - name: Publish redis-detective to npm
        working-directory: packages/cli/publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # npm provenance requires a public source repo. A private repo still publishes a
          # public package; it just omits the provenance attestation (HTTP 422 otherwise).
          SOURCE_IS_PUBLIC: ${{ github.event.repository.visibility == 'public' }}
        run: |
          if [ "$SOURCE_IS_PUBLIC" = "true" ]; then
            npm publish --access public --provenance
          else
            echo "Skipping npm provenance: source repository is not public."
            npm publish --access public
          fi
