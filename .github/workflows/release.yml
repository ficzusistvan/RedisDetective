name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Needed only when the source repo is public (npm provenance). Harmless on a private repo.
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Check git tag matches CLI and core versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cli_version="$(node -p "require('./packages/cli/package.json').version")"
          core_version="$(node -p "require('./packages/core/package.json').version")"
          if [ "$tag" != "$cli_version" ]; then
            echo "Tag v${tag} does not match packages/cli version ${cli_version}."
            exit 1
          fi
          if [ "$tag" != "$core_version" ]; then
            echo "Tag v${tag} does not match packages/core version ${core_version}."
            exit 1
          fi
      - name: Publish @redis-detective/core to npm
        working-directory: packages/core/publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          SOURCE_IS_PUBLIC: ${{ github.event.repository.visibility == 'public' }}
        run: |
          # Normal npm publish of the staged package directory (not a dry-run / staged-only publish).
          if [ "$SOURCE_IS_PUBLIC" = "true" ]; then
            npm publish --access public --provenance
          else
            echo "Skipping npm provenance: source repository is not public."
            npm publish --access public
          fi
      - name: Wait until @redis-detective/core is resolvable on the registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="$(node -p "require('./packages/core/package.json').version")"
          package="@redis-detective/core@${version}"
          tarball="/tmp/redis-detective-core-${version}.tgz"
          echo "Waiting for ${package} to appear on npm…"
          for attempt in $(seq 1 36); do
            if npm view "${package}" version >/tmp/core-view.txt 2>/tmp/core-view.err \
              && [ "$(tr -d '[:space:]' </tmp/core-view.txt)" = "${version}" ]; then
              dist_tarball="$(npm view "${package}" dist.tarball)"
              if [ -n "$dist_tarball" ] && curl -fsSL "$dist_tarball" -o "$tarball"; then
                echo "Resolved ${package}; downloaded $(wc -c <"$tarball") bytes from ${dist_tarball}."
                exit 0
              fi
            fi
            echo "Attempt ${attempt}/36: not ready yet; sleeping 10s."
            sleep 10
          done
          echo "Timed out waiting for ${package} on npm." >&2
          cat /tmp/core-view.err >&2 || true
          exit 1
      - name: Publish redis-detective to npm
        working-directory: packages/cli/publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # npm provenance requires a public source repo. A private repo still publishes a
          # public package; it just omits the provenance attestation (HTTP 422 otherwise).
          SOURCE_IS_PUBLIC: ${{ github.event.repository.visibility == 'public' }}
        run: |
          if [ "$SOURCE_IS_PUBLIC" = "true" ]; then
            npm publish --access public --provenance
          else
            echo "Skipping npm provenance: source repository is not public."
            npm publish --access public
          fi
